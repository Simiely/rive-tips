name: repo-check

on:
  pull_request:
    paths:
      - 'docs/**'
      - 'skills/**'
      - 'tools/**'
      - 'schema/**'
      - 'README.md'
      - 'AGENTS.md'
      - 'DEVELOPMENT.md'
      - 'CHANGELOG.md'
      - 'requirements.txt'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  invariants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Invariants (link-only)
        run: python tools/repo-kit/check_repo.py --root .
      - name: Kit lock
        run: pwsh tools/update-repo-kit.ps1 -Check

  skill-sync:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: docs -> references snapshot
        run: pwsh -NoProfile -File tools/sync-skill.ps1 -Check
